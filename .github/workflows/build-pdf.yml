# build-pdf.yml — Build e Release per I Lupi dell'Assia (Rural Gothic)
#
# Output:
#   output/I_Lupi_dell_Assia_MODULO_BASE.pdf
#   output/I_Lupi_dell_Assia_PREGENERATI.pdf
#   output/I_Lupi_dell_Assia_SUPPLEMENTO_CRONISTA.pdf

name: Build PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc fonts-dejavu python3-pip
          pip install weasyprint --break-system-packages

      # ── Build PDF ────────────────────────────────────────────
      - name: Build Modulo Base PDF
        run: python3 scripts/assemble.py modulo-base

      - name: Build Pregenerati PDF
        run: python3 scripts/assemble.py pregenerati

      - name: Build Supplemento Cronista PDF
        run: python3 scripts/assemble.py supplemento

      # ── Upload artifact ──────────────────────────────────────
      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: i-lupi-dell-assia-pdf
          path: |
            output/I_Lupi_dell_Assia_MODULO_BASE.pdf
            output/I_Lupi_dell_Assia_PREGENERATI.pdf
            output/I_Lupi_dell_Assia_SUPPLEMENTO_CRONISTA.pdf
          if-no-files-found: error
          retention-days: 30

      # ── GitHub Release (solo su tag v*) ──────────────────────
      - name: Crea Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/I_Lupi_dell_Assia_MODULO_BASE.pdf
            output/I_Lupi_dell_Assia_PREGENERATI.pdf
            output/I_Lupi_dell_Assia_SUPPLEMENTO_CRONISTA.pdf
          generate_release_notes: true
          name: "I Lupi dell'Assia ${{ github.ref_name }}"
          body: |
            ## I Lupi dell'Assia ${{ github.ref_name }}

            Un modulo per **Rural Gothic** di Smart Bonsai Games.

            ### Download
            - **Modulo Base** — Scenario completo con regole, luoghi, dilemmi e finali
            - **Pregenerati** — 6 schede personaggio con segreti terribili
            - **Supplemento Cronista** — Materiali espansi, lettere complete, albero decisionale

            ### Versione
            v1.1 — Post Chaos Testing (300.000 sessioni simulate)
